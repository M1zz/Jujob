  <path fill="#FFFFFF" d="M836 96 C842 140 858 156 902 162 C858 168 842 184 836 228 C830 184 814 168 770 162 C814 156 830 140 836 96 Z"/>
  <path fill="#FFFFFF" opacity="0.9" d="M716 78 C719 100 727 108 749 111 C727 114 719 122 716 144 C713 122 705 114 683 111 C705 108 713 100 716 78 Z"/>
